{% extends 'base.html' %}
{% block title %}Add Course{% endblock %}
{% block page_title %}Add Course{% endblock %}

{% block sidebar_links %}
<a href="{{ url_for('admin.dashboard') }}" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="{{ url_for('admin.students') }}" class="nav-link"><i class="bi bi-people"></i> Students</a>
<a href="{{ url_for('admin.lecturers') }}" class="nav-link"><i class="bi bi-person-badge"></i> Lecturers</a>
<a href="{{ url_for('admin.courses') }}" class="nav-link active"><i class="bi bi-book"></i> Courses</a>
<a href="{{ url_for('admin.reports') }}" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reports</a>
<a href="{{ url_for('admin.model_metrics') }}" class="nav-link"><i class="bi bi-cpu"></i> ML Model</a>
<a href="{{ url_for('admin.notifications') }}" class="nav-link"><i class="bi bi-bell"></i> Notifications</a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card p-4">
      <h5 class="mb-4">Add New Course</h5>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label">Course Code *</label>
            <input type="text" name="code" class="form-control" placeholder="e.g. CSC301" required />
          </div>
          <div class="col-md-7">
            <label class="form-label">Course Name *</label>
            <input type="text" name="name" class="form-control" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Credit Units</label>
            <input type="number" name="credit_units" class="form-control" value="3" min="1" max="6" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Level</label>
            <select name="level" class="form-select">
              <option value="100">100</option><option value="200">200</option>
              <option value="300">300</option><option value="400">400</option>
              <option value="500">500</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Semester *</label>
            <select name="semester" class="form-select" required>
              <option value="First">First</option><option value="Second">Second</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Session *</label>
            <input type="text" name="session" class="form-control" placeholder="2023/2024" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" />
          </div>
          <div class="col-12">
            <label class="form-label">Assign Lecturer</label>
            <select name="lecturer_id" class="form-select">
              <option value="">— None —</option>
              {% for l in lecturers %}
              <option value="{{ l.id }}">{{ l.user.full_name }} ({{ l.staff_id }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12 d-flex gap-2 justify-content-end">
            <a href="{{ url_for('admin.courses') }}" class="btn btn-light">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Course</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
