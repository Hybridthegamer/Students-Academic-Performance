{% extends 'base.html' %}
{% block title %}Add Lecturer{% endblock %}
{% block page_title %}Add Lecturer{% endblock %}

{% block sidebar_links %}
<a href="{{ url_for('admin.dashboard') }}" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="{{ url_for('admin.students') }}" class="nav-link"><i class="bi bi-people"></i> Students</a>
<a href="{{ url_for('admin.lecturers') }}" class="nav-link active"><i class="bi bi-person-badge"></i> Lecturers</a>
<a href="{{ url_for('admin.courses') }}" class="nav-link"><i class="bi bi-book"></i> Courses</a>
<a href="{{ url_for('admin.reports') }}" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reports</a>
<a href="{{ url_for('admin.model_metrics') }}" class="nav-link"><i class="bi bi-cpu"></i> ML Model</a>
<a href="{{ url_for('admin.notifications') }}" class="nav-link"><i class="bi bi-bell"></i> Notifications</a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card p-4">
      <h5 class="mb-4">Add Lecturer</h5>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Full Name *</label><input type="text" name="full_name" class="form-control" required /></div>
          <div class="col-md-6"><label class="form-label">Staff ID *</label><input type="text" name="staff_id" class="form-control" required /></div>
          <div class="col-md-6"><label class="form-label">Username *</label><input type="text" name="username" class="form-control" required /></div>
          <div class="col-md-6"><label class="form-label">Email *</label><input type="email" name="email" class="form-control" required /></div>
          <div class="col-md-6"><label class="form-label">Password *</label><input type="password" name="password" class="form-control" required /></div>
          <div class="col-md-6"><label class="form-label">Department *</label>
            <select name="department" class="form-select" required>
              <option>Computer Science</option><option>Electrical Engineering</option>
              <option>Mechanical Engineering</option><option>Civil Engineering</option>
              <option>Business Administration</option><option>Accounting</option>
              <option>Economics</option><option>Medicine</option>
              <option>Law</option><option>Mass Communication</option><option>Other</option>
            </select>
          </div>
          <div class="col-md-6"><label class="form-label">Faculty</label><input type="text" name="faculty" class="form-control" /></div>
          <div class="col-md-6"><label class="form-label">Designation</label><input type="text" name="designation" class="form-control" placeholder="e.g. Senior Lecturer" /></div>
          <div class="col-12 d-flex gap-2 justify-content-end">
            <a href="{{ url_for('admin.lecturers') }}" class="btn btn-light">Cancel</a>
            <button type="submit" class="btn btn-primary">Add Lecturer</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
