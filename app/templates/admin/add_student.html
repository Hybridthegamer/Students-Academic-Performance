{% extends 'base.html' %}
{% block title %}Add Student{% endblock %}
{% block page_title %}Add Student{% endblock %}

{% block sidebar_links %}
<a href="{{ url_for('admin.dashboard') }}" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="{{ url_for('admin.students') }}" class="nav-link active"><i class="bi bi-people"></i> Students</a>
<a href="{{ url_for('admin.lecturers') }}" class="nav-link"><i class="bi bi-person-badge"></i> Lecturers</a>
<a href="{{ url_for('admin.courses') }}" class="nav-link"><i class="bi bi-book"></i> Courses</a>
<a href="{{ url_for('admin.reports') }}" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reports</a>
<a href="{{ url_for('admin.model_metrics') }}" class="nav-link"><i class="bi bi-cpu"></i> ML Model</a>
<a href="{{ url_for('admin.notifications') }}" class="nav-link"><i class="bi bi-bell"></i> Notifications</a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card p-4">
      <h5 class="mb-4">Register New Student</h5>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name *</label>
            <input type="text" name="full_name" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Matric Number *</label>
            <input type="text" name="matric_number" class="form-control" placeholder="e.g. CSC/2021/001" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Username *</label>
            <input type="text" name="username" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Email *</label>
            <input type="email" name="email" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Password *</label>
            <input type="password" name="password" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Gender *</label>
            <select name="gender" class="form-select" required>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Department *</label>
            <select name="department" class="form-select" required>
              <option value="">Select department</option>
              <option>Computer Science</option>
              <option>Electrical Engineering</option>
              <option>Mechanical Engineering</option>
              <option>Civil Engineering</option>
              <option>Business Administration</option>
              <option>Accounting</option>
              <option>Economics</option>
              <option>Medicine</option>
              <option>Law</option>
              <option>Mass Communication</option>
              <option>Other</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Level *</label>
            <select name="level" class="form-select" required>
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="300">300</option>
              <option value="400">400</option>
              <option value="500">500</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Faculty</label>
            <input type="text" name="faculty" class="form-control" />
          </div>
          <div class="col-12 d-flex gap-2 justify-content-end">
            <a href="{{ url_for('admin.students') }}" class="btn btn-light">Cancel</a>
            <button type="submit" class="btn btn-primary">Register Student</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
